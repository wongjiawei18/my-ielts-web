<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>雅思机考模拟平台</title>
    <style>
        body { font-family: -apple-system, system-ui, sans-serif; display: flex; margin: 0; background: #f4f7f9; height: 100vh; overflow: hidden; }
        /* 侧边栏 */
        #sidebar { width: 300px; background: #fff; padding: 25px; border-right: 1px solid #e1e4e8; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        /* 主内容区 */
        #main { flex: 1; padding: 20px; overflow-y: auto; scroll-behavior: smooth; }
        .card { background: #fff; padding: 20px; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.07); border: 1px solid #eee; }
        iframe { width: 100%; height: 700px; border: 1px solid #f0f0f0; border-radius: 8px; margin-top: 15px; }
        /* 按钮样式 */
        .btn { padding: 12px; cursor: pointer; border: none; border-radius: 8px; margin-bottom: 12px; font-weight: 600; transition: all 0.2s; }
        .btn-blue { background: #2563eb; color: white; }
        .btn-blue:hover { background: #1d4ed8; }
        .btn-yellow { background: #fef08a; color: #854d0e; border: 1px solid #facc15; }
        .btn-green { background: #22c55e; color: white; }
        .stats { background: #f8fafc; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; color: #475569; }
        h2 { margin-top: 0; color: #1e293b; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>雅思助手 🎧</h2>
    <div class="stats" id="stats">载入统计中...</div>
    <button class="btn btn-blue" onclick="startTest()">🎲 随机生成一套试卷</button>
    <button class="btn btn-yellow" onclick="doHighlight()">🖌️ 高亮选中文字</button>
    <button class="btn btn-green" onclick="saveAnswers()">💾 保存做题进度</button>
    <p style="font-size: 12px; color: #94a3b8; line-height: 1.5;">* 选中题目中的文字后点击黄色按钮即可高亮。答案自动保存在本地。</p>
</div>

<div id="main">
    <div id="exam-container">
        <div style="text-align: center; margin-top: 100px; color: #94a3b8;">
            <h1>Ready to practice?</h1>
            <p>点击左侧按钮随机抽取 P1-P4 试题</p>
        </div>
    </div>
</div>

<script src="database.js"></script>
<script>
    // 初始化本地存储
    let userData = JSON.parse(localStorage.getItem('ielts_data')) || { count: 0, answers: {} };

    function updateStats() {
        document.getElementById('stats').innerHTML = `已练习总套数：<b style="color:#2563eb; font-size:18px;">${userData.count}</b>`;
        localStorage.setItem('ielts_data', JSON.stringify(userData));
    }

    function startTest() {
        const container = document.getElementById('exam-container');
        container.innerHTML = '<h2 style="text-align:center">正在拼命组卷中...</h2>';
        
        // 增加练习计数
        userData.count++;
        updateStats();

        const parts = ['P1', 'P2', 'P3', 'P4'];
        container.innerHTML = '';
        
        parts.forEach(p => {
            const pool = questionBank.filter(q => q.part === p);
            if(pool.length === 0) return;

            const item = pool[Math.floor(Math.random() * pool.length)];
            
            const div = document.createElement('div');
            div.className = 'card';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>Part ${p}: ${item.title}</h3>
                    ${item.high ? '<span style="background:#fee2e2; color:#b91c1c; padding:4px 8px; border-radius:4px; font-size:12px;">🔥 高频题</span>' : ''}
                </div>
                <audio controls src="${item.audio}" style="width:100%; margin: 10px 0;"></audio>
                <iframe src="${item.html}" data-id="${item.title}" id="frame-${p}"></iframe>
            `;
            container.appendChild(div);
        });
        document.getElementById('main').scrollTop = 0;
    }

    // 高亮功能
    function doHighlight() {
        const frames = document.querySelectorAll('iframe');
        let highlighted = false;
        frames.forEach(f => {
            try {
                const win = f.contentWindow;
                const doc = f.contentDocument || win.document;
                const sel = win.getSelection();
                if (sel.rangeCount > 0 && sel.toString().length > 0) {
                    const range = sel.getRangeAt(0);
                    const span = doc.createElement('span');
                    span.style.backgroundColor = '#fef08a';
                    span.style.color = '#000';
                    range.surroundContents(span);
                    highlighted = true;
                }
            } catch (e) { console.error("无法操作 iframe，可能存在跨域问题。上传到 GitHub 后即可正常使用。"); }
        });
        if(!highlighted) alert("请先在题目中选中一段文字！");
    }

    // 保存答案功能
    function saveAnswers() {
        const frames = document.querySelectorAll('iframe');
        frames.forEach(f => {
            const title = f.getAttribute('data-id');
            const inputs = f.contentDocument.querySelectorAll('input[type="text"]');
            let ans = {};
            inputs.forEach((input, index) => {
                ans[index] = input.value;
            });
            userData.answers[title] = ans;
        });
        localStorage.setItem('ielts_data', JSON.stringify(userData));
        alert('答案已保存到当前浏览器！');
    }

    updateStats();
</script>
</body>
</html>
