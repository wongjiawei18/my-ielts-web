<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>雅思连贯机考系统 - 增强记录版</title>
    <style>
        :root { --primary: #2563eb; --success: #22c55e; --danger: #ef4444; --bg: #f8fafc; }
        body { font-family: system-ui, sans-serif; margin: 0; display: flex; background: var(--bg); height: 100vh; overflow: hidden; }
        
        /* 侧边栏 */
        #sidebar { width: 280px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 20px; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        .stats-card { background: var(--primary); color: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .btn-random { background: #f59e0b; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        .btn-random:hover { background: #d97706; }
        
        /* 清空按钮样式 */
        .btn-clear { background: #fff; color: var(--danger); border: 1px solid var(--danger); padding: 8px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-top: 20px; transition: 0.2s; }
        .btn-clear:hover { background: var(--danger); color: #fff; }
        
        /* 主视图 */
        #main-content { flex: 1; overflow-y: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .card { background: #fff; border-radius: 10px; padding: 15px; border: 1px solid #e2e8f0; cursor: pointer; position: relative; }
        .card.done { border-top: 4px solid var(--success); }
        .card .count-badge { position: absolute; top: 10px; right: 10px; font-size: 10px; background: #f1f5f9; padding: 2px 6px; border-radius: 4px; color: #64748b; }

        /* 考试大浮层 */
        #exam-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: none; flex-direction: column; }
        .exam-nav { background: #1e293b; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        
        #control-bar { background: #fff; border-bottom: 2px solid #eee; padding: 15px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .part-switcher { display: flex; gap: 10px; }
        .nav-btn { padding: 8px 25px; border: 1px solid #ddd; background: #f8fafc; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .nav-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        #iframe-container { flex: 1; position: relative; background: #eee; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; top: 0; left: 0; display: none; }
        iframe.active { display: block; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3 style="margin-top:0">📊 学习数据</h3>
    <div class="stats-card">
        <div style="font-size:12px; opacity:0.8">累计练习次数</div>
        <div style="font-size:28px; font-weight:bold;" id="total-display">0</div>
    </div>
    
    <button class="btn-random" onclick="startFullMock()">🎲 生成 P1-P4 模拟全套</button>
    <div id="part-stats" style="font-size: 13px; line-height: 2; color: #64748b;"></div>

    <button class="btn-clear" onclick="clearHistory()">🗑️ 清空做题次数</button>
</div>

<div id="main-content">
    <div id="quiz-grid" class="grid"></div>
</div>

<div id="exam-overlay">
    <div class="exam-nav">
        <span id="exam-title">雅思连贯机考模式</span>
        <button onclick="exitExam()" style="background:var(--danger); color:#fff; border:none; padding:6px 15px; border-radius:4px; cursor:pointer;">退出</button>
    </div>
    <div id="control-bar">
        <div style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 20px;">
            <span id="audio-label" style="font-size: 14px; color: var(--success); font-weight: bold;">就绪</span>
            <audio id="global-player" controls style="width: 50%;"></audio>
        </div>
        <div class="part-switcher" id="nav-btns"></div>
    </div>
    <div id="iframe-container"></div>
</div>

<script src="database.js"></script>
<script>
    let sessionData = [];
    let currentPlayingIdx = 0;
    let history = JSON.parse(localStorage.getItem('ielts_history_v2')) || {};

    function render() {
        const grid = document.getElementById('quiz-grid');
        grid.innerHTML = '';
        
        let totalCount = 0;
        questionBank.forEach(item => {
            const count = history[item.title] || 0;
            totalCount += count;
            const card = document.createElement('div');
            card.className = `card ${count > 0 ? 'done' : ''}`;
            card.onclick = () => { sessionData = [item]; openOverlay(); };
            card.innerHTML = `
                <div class="count-badge">练过 ${count} 次</div>
                <small style="color:var(--primary); font-weight:bold">${item.part}</small>
                <div style="font-weight:bold; margin-top:5px;">${item.title}</div>
            `;
            grid.appendChild(card);
        });
        
        document.getElementById('total-display').innerText = totalCount;
        updatePartStats();
    }

    function updatePartStats() {
        const statsBox = document.getElementById('part-stats');
        let html = '<b>各部分进度：</b><br>';
        ['P1','P2','P3','P4'].forEach(p => {
            const total = questionBank.filter(q => q.part === p).length;
            const done = questionBank.filter(q => q.part === p && history[q.title] > 0).length;
            html += `${p}: ${done} / ${total}<br>`;
        });
        statsBox.innerHTML = html;
    }

    // 核心功能：清空记录
    function clearHistory() {
        if (confirm("确定要清空所有的做题次数记录吗？此操作不可恢复。")) {
            history = {};
            localStorage.removeItem('ielts_history_v2');
            localStorage.setItem('ielts_total_sessions', '0'); // 如果有其他计数也一并归零
            render();
            alert("记录已全部清空，开启新一轮刷题吧！");
        }
    }

    function startFullMock() {
        sessionData = [];
        ['P1','P2','P3','P4'].forEach(p => {
            const pool = questionBank.filter(q => q.part === p);
            if(pool.length > 0) sessionData.push(pool[Math.floor(Math.random() * pool.length)]);
        });
        openOverlay();
    }

    function openOverlay() {
        const nav = document.getElementById('nav-btns');
        const container = document.getElementById('iframe-container');
        nav.innerHTML = '';
        container.innerHTML = '';

        sessionData.forEach((item, idx) => {
            history[item.title] = (history[item.title] || 0) + 1;
            const btn = document.createElement('button');
            btn.className = `nav-btn ${idx === 0 ? 'active' : ''}`;
            btn.innerText = `Part ${item.part.replace('P','')}`;
            btn.onclick = () => switchTab(idx);
            nav.appendChild(btn);

            const frame = document.createElement('iframe');
            frame.id = `frame-${idx}`;
            frame.src = item.html;
            if(idx === 0) frame.className = 'active';
            container.appendChild(frame);
        });

        localStorage.setItem('ielts_history_v2', JSON.stringify(history));
        loadAudio(0);
        document.getElementById('exam-overlay').style.display = 'flex';
    }

    function loadAudio(idx) {
        const player = document.getElementById('global-player');
        const label = document.getElementById('audio-label');
        if(!sessionData[idx]) return;

        currentPlayingIdx = idx;
        player.src = sessionData[idx].audio;
        label.innerText = `正在播放: Part ${sessionData[idx].part}`;
        player.play();

        player.onended = function() {
            if(currentPlayingIdx < sessionData.length - 1) {
                loadAudio(currentPlayingIdx + 1);
            } else {
                label.innerText = "✅ 听力全部播放完毕";
            }
        };
    }

    function switchTab(idx) {
        document.querySelectorAll('.nav-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        document.querySelectorAll('iframe').forEach((f, i) => f.classList.toggle('active', i === idx));
    }

    function exitExam() {
        document.getElementById('global-player').pause();
        document.getElementById('exam-overlay').style.display = 'none';
        render();
    }

    window.onload = render;
</script>
</body>
</html>
