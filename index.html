<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>雅思极简机考系统</title>
    <style>
        :root { --primary: #2563eb; --success: #22c55e; --danger: #ef4444; --bg: #f8fafc; --dark: #1e293b; }
        body { font-family: system-ui, sans-serif; margin: 0; display: flex; background: var(--bg); height: 100vh; overflow: hidden; }
        
        /* 侧边栏 */
        #sidebar { width: 260px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 20px; }
        .stats-card { background: var(--primary); color: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .btn-random { background: #f59e0b; color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 10px; }
        
        /* 主页网格 */
        #main-content { flex: 1; overflow-y: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #fff; border-radius: 10px; padding: 15px; border: 1px solid #e2e8f0; cursor: pointer; position: relative; }
        .card.done { border-top: 4px solid var(--success); }
        .card .count-badge { position: absolute; top: 10px; right: 10px; font-size: 10px; color: #94a3b8; }

        /* 考试窗口：超薄顶部栏 */
        #exam-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: none; flex-direction: column; }
        
        /* 核心改变：一体化超薄导航栏 */
        .ultra-nav { background: var(--dark); color: #fff; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
        
        .nav-left { display: flex; align-items: center; gap: 15px; flex: 1; }
        .nav-center { flex: 1; display: flex; justify-content: center; align-items: center; gap: 20px; }
        .nav-right { flex: 1; display: flex; justify-content: flex-end; gap: 10px; }

        #global-player { height: 30px; width: 200px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); } /* 播放器变白变细 */
        .timer-display { font-family: monospace; font-size: 20px; font-weight: bold; color: #fbbf24; }
        .part-tag { font-size: 12px; background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 4px; }

        /* 题目切换按钮移到左边 */
        .mini-btn { padding: 4px 12px; border: 1px solid rgba(255,255,255,0.3); background: transparent; color: #fff; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .mini-btn.active { background: var(--primary); border-color: var(--primary); }

        #iframe-container { flex: 1; position: relative; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; display: none; }
        iframe.active { display: block; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="stats-card">
        <div style="font-size:12px; opacity:0.8">累计练习</div>
        <div style="font-size:26px; font-weight:bold;" id="total-display">0</div>
    </div>
    <button class="btn-random" onclick="startFullMock()">🎲 随机全套 (优先新题)</button>
    <div id="part-stats" style="font-size: 13px; line-height: 1.8; color: #64748b;"></div>
    <button style="margin-top:auto; font-size:11px; opacity:0.5; border:none; background:none; cursor:pointer;" onclick="clearHistory()">清空记录</button>
</div>

<div id="main-content">
    <div class="grid" id="quiz-grid"></div>
</div>

<div id="exam-overlay">
    <div class="ultra-nav">
        <div class="nav-left" id="nav-btns"></div>
        
        <div class="nav-center">
            <span id="audio-label" class="part-tag">Part 1</span>
            <audio id="global-player" controls></audio>
            <div class="timer-display" id="timer">00:00:00</div>
        </div>

        <div class="nav-right">
            <button onclick="exitExam()" style="background:var(--danger); color:#fff; border:none; padding:4px 12px; border-radius:4px; cursor:pointer; font-size:13px;">退出</button>
        </div>
    </div>

    <div id="iframe-container"></div>
</div>

<script src="database.js"></script>
<script>
    let sessionData = [];
    let currentPlayingIdx = 0;
    let history = JSON.parse(localStorage.getItem('ielts_history_v2')) || {};
    let timerInterval, secondsElapsed = 0;

    function render() {
        const grid = document.getElementById('quiz-grid');
        grid.innerHTML = '';
        let total = 0;
        questionBank.forEach(item => {
            const count = history[item.title] || 0;
            total += count;
            const card = document.createElement('div');
            card.className = `card ${count > 0 ? 'done' : ''}`;
            card.onclick = () => { sessionData = [item]; openOverlay(); };
            card.innerHTML = `<div class="count-badge">${count}次</div><small>${item.part}</small><div style="font-weight:bold">${item.title}</div>`;
            grid.appendChild(card);
        });
        document.getElementById('total-display').innerText = total;
        updatePartStats();
    }

    function updatePartStats() {
        const box = document.getElementById('part-stats');
        let html = '';
        ['P1','P2','P3','P4'].forEach(p => {
            const t = questionBank.filter(q => q.part === p).length;
            const d = questionBank.filter(q => q.part === p && history[q.title] > 0).length;
            html += `${p}: ${d} / ${t}<br>`;
        });
        box.innerHTML = html;
    }

    function startFullMock() {
        sessionData = [];
        ['P1','P2','P3','P4'].forEach(p => {
            const pool = questionBank.filter(q => q.part === p);
            let neverDone = pool.filter(q => (history[q.title] || 0) === 0);
            let finalPool = neverDone.length > 0 ? neverDone : pool;
            if(finalPool.length > 0) sessionData.push(finalPool[Math.floor(Math.random() * finalPool.length)]);
        });
        if(sessionData.length > 0) openOverlay();
    }

    function openOverlay() {
        const nav = document.getElementById('nav-btns');
        const container = document.getElementById('iframe-container');
        nav.innerHTML = ''; container.innerHTML = '';
        
        sessionData.forEach((item, idx) => {
            history[item.title] = (history[item.title] || 0) + 1;
            const btn = document.createElement('button');
            btn.className = `mini-btn ${idx === 0 ? 'active' : ''}`;
            btn.innerText = `P${idx + 1}`;
            btn.onclick = () => switchTab(idx);
            nav.appendChild(btn);

            const frame = document.createElement('iframe');
            frame.id = `frame-${idx}`;
            frame.src = item.html;
            if(idx === 0) frame.className = 'active';
            container.appendChild(frame);
        });

        localStorage.setItem('ielts_history_v2', JSON.stringify(history));
        document.getElementById('exam-overlay').style.display = 'flex';
        startTimer();
        loadAudio(0);
    }

    function loadAudio(idx) {
        const player = document.getElementById('global-player');
        if(!sessionData[idx]) return;
        currentPlayingIdx = idx;
        player.src = sessionData[idx].audio;
        document.getElementById('audio-label').innerText = `Playing: P${idx+1}`;
        player.play();

        player.onended = function() {
            if(currentPlayingIdx < sessionData.length - 1) {
                loadAudio(currentPlayingIdx + 1);
            } else {
                autoSubmitAll(); // 全部结束自动提交
            }
        };
    }

    // 强化版提交：尝试多种手段触发子页面的提交
    function autoSubmitAll() {
        document.getElementById('audio-label').innerText = "Finishing...";
        sessionData.forEach((_, idx) => {
            const frame = document.getElementById(`frame-${idx}`);
            try {
                const win = frame.contentWindow;
                const doc = win.document;
                // 1. 尝试直接调用页面可能存在的函数
                if(typeof win.checkAnswers === 'function') win.checkAnswers();
                if(typeof win.finishTest === 'function') win.finishTest();
                // 2. 尝试寻找并点击各种可能的提交按钮
                const selectors = ['#finish', '#submit', '.check-button', 'input[type="button"][value*="Finish"]', 'button:contains("Finish")'];
                selectors.forEach(s => {
                    const btn = doc.querySelector(s);
                    if(btn) btn.click();
                });
            } catch (e) { console.log("Submit failed for part " + idx); }
        });
        stopTimer();
    }

    function startTimer() {
        secondsElapsed = 0;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            secondsElapsed++;
            const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const s = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `00:${m}:${s}`;
        }, 1000);
    }

    function stopTimer() { clearInterval(timerInterval); }

    function switchTab(idx) {
        document.querySelectorAll('.mini-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        document.querySelectorAll('iframe').forEach((f, i) => f.classList.toggle('active', i === idx));
    }

    function exitExam() {
        if(confirm("退出？")) {
            stopTimer();
            document.getElementById('global-player').pause();
            document.getElementById('exam-overlay').style.display = 'none';
            render();
        }
    }

    function clearHistory() {
        if(confirm("清空？")) { history = {}; localStorage.removeItem('ielts_history_v2'); render(); }
    }

    window.onload = render;
</script>
</body>
</html>
