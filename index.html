<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>雅思机考极简精听版 - 增强存档记录</title>
    <style>
        :root { --primary: #2563eb; --success: #22c55e; --danger: #ef4444; --bg: #f8fafc; --dark: #111827; --accent: #f59e0b; }
        body { font-family: system-ui, sans-serif; margin: 0; display: flex; background: var(--bg); height: 100vh; overflow: hidden; }
        
        /* 侧边栏与主页网格 */
        #sidebar { width: 260px; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
        .stats-card { background: var(--primary); color: #fff; padding: 15px; border-radius: 12px; margin-bottom: 20px; }
        .btn-random { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 20px; }

        /* ⭐ 新增：上次考题展示区 */
        .last-session-box { background: #fff7ed; padding: 12px; border-radius: 10px; border: 1px solid #fed7aa; margin-bottom: 20px; display: none; }
        .last-session-title { font-size: 12px; font-weight: bold; color: #9a3412; margin-bottom: 8px; border-bottom: 1px solid #ffedd5; padding-bottom: 5px; }
        .last-session-item { font-size: 12px; color: var(--primary); cursor: pointer; display: block; padding: 4px 0; text-decoration: underline; }
        .last-session-item:hover { color: var(--dark); }
        
        #main-content { flex: 1; overflow-y: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { background: #fff; border-radius: 10px; padding: 15px; border: 1px solid #e2e8f0; cursor: pointer; position: relative; }
        .card.done { border-top: 4px solid var(--success); }
        .card .count-badge { position: absolute; top: 10px; right: 10px; font-size: 10px; color: #94a3b8; }

        /* 考试窗口 */
        #exam-overlay { position: fixed; inset: 0; background: #fff; z-index: 2000; display: none; flex-direction: column; }
        .ultra-nav { background: var(--dark); color: #fff; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; flex-shrink: 0; }
        
        .nav-left { display: flex; align-items: center; gap: 8px; flex: 1; }
        .nav-center { flex: 2; display: flex; justify-content: center; align-items: center; gap: 15px; }
        .nav-right { flex: 1; display: flex; justify-content: flex-end; gap: 8px; }

        #global-player { height: 35px; width: 30vw; max-width: 500px; filter: invert(100%) hue-rotate(180deg) brightness(1.5); } 
        .timer-display { font-family: monospace; font-size: 18px; font-weight: bold; color: #fbbf24; margin-right: 10px; }
        .part-tag { font-size: 11px; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 3px; white-space: nowrap; }

        .skip-btn { padding: 4px 12px; border: none; background: #10b981; color: #fff; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .mini-btn { padding: 3px 12px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
        .mini-btn.active { background: var(--primary); border-color: var(--primary); }

        #iframe-container { flex: 1; position: relative; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; position: absolute; display: none; }
        iframe.active { display: block; }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="stats-card">
        <div style="font-size:12px; opacity:0.8">累计练习</div>
        <div style="font-size:26px; font-weight:bold;" id="total-display">0</div>
    </div>
    
    <button class="btn-random" onclick="startFullMock()">🎲 随机全套 (优先新题)</button>

    <div id="last-session-box" class="last-session-box">
        <div class="last-session-title">🕒 上次模考题目</div>
        <div id="last-session-list"></div>
    </div>

    <div id="part-stats" style="font-size: 13px; line-height: 1.8; color: #64748b; margin-bottom: 20px;"></div>
    
    <button style="margin-top:auto; font-size:11px; opacity:0.3; border:none; background:none; cursor:pointer;" onclick="clearHistory()">清空记录</button>
</div>

<div id="main-content">
    <div class="grid" id="quiz-grid"></div>
</div>

<div id="exam-overlay">
    <div class="ultra-nav">
        <div class="nav-left" id="nav-btns"></div>
        <div class="nav-center">
            <span id="audio-label" class="part-tag">Ready</span>
            <audio id="global-player" controls></audio>
            <button id="skip-audio-btn" class="skip-btn" onclick="skipToNextAudio()" style="display: none;">下一 Part ⏭️</button>
        </div>
        <div class="nav-right">
            <div class="timer-display" id="timer">00:00:00</div>
            <button onclick="exitExam()" style="background:var(--danger); color:#fff; border:none; padding:4px 12px; border-radius:4px; cursor:pointer; font-size:13px;">退出</button>
        </div>
    </div>
    <div id="iframe-container"></div>
</div>

<script src="database.js"></script>
<script>
    let sessionData = [];
    let currentPlayingIdx = 0;
    let history = JSON.parse(localStorage.getItem('ielts_history_v2')) || {};
    // ⭐ 新增：从本地存储读取上次会话
    let lastSession = JSON.parse(localStorage.getItem('ielts_listening_last_session')) || [];
    let timerInterval, secondsElapsed = 0;

    function render() {
        const grid = document.getElementById('quiz-grid');
        grid.innerHTML = '';
        let total = 0;
        questionBank.forEach(item => {
            const count = history[item.title] || 0;
            total += count;
            const card = document.createElement('div');
            card.className = `card ${count > 0 ? 'done' : ''}`;
            card.onclick = () => { sessionData = [item]; openOverlay(); };
            card.innerHTML = `<div class="count-badge">${count}次</div><small>${item.part}</small><div style="font-weight:bold">${item.title}</div>`;
            grid.appendChild(card);
        });
        document.getElementById('total-display').innerText = total;
        updatePartStats();
        updateLastSessionUI(); // 渲染上次考题
    }

    // ⭐ 新增：渲染侧边栏的上次考题列表
    function updateLastSessionUI() {
        const box = document.getElementById('last-session-box');
        const list = document.getElementById('last-session-list');
        if (lastSession.length > 0) {
            box.style.display = 'block';
            list.innerHTML = lastSession.map(item => 
                `<span class="last-session-item" onclick="reopenLastSession()">🎧 ${item.title}</span>`
            ).join('');
        } else {
            box.style.display = 'none';
        }
    }

    // ⭐ 新增：重新打开上次那一整套题
    function reopenLastSession() {
        if (lastSession.length > 0) {
            sessionData = lastSession;
            openOverlay(true); // 传入 true 表示是从记录恢复，不重复增加练习次数
        }
    }

    function updatePartStats() {
        const box = document.getElementById('part-stats');
        let html = '';
        ['P1','P2','P3','P4'].forEach(p => {
            const t = questionBank.filter(q => q.part === p).length;
            const d = questionBank.filter(q => q.part === p && history[q.title] > 0).length;
            html += `${p}: ${d} / ${t}<br>`;
        });
        box.innerHTML = html;
    }

    function startFullMock() {
        sessionData = [];
        ['P1','P2','P3','P4'].forEach(p => {
            const pool = questionBank.filter(q => q.part === p);
            let neverDone = pool.filter(q => (history[q.title] || 0) === 0);
            let finalPool = neverDone.length > 0 ? neverDone : pool;
            if(finalPool.length > 0) sessionData.push(finalPool[Math.floor(Math.random() * finalPool.length)]);
        });

        if(sessionData.length > 0) {
            // ⭐ 关键：存入上次会话
            lastSession = sessionData;
            localStorage.setItem('ielts_listening_last_session', JSON.stringify(lastSession));
            openOverlay();
        }
    }

    function openOverlay(isRestore = false) {
        const nav = document.getElementById('nav-btns');
        const container = document.getElementById('iframe-container');
        nav.innerHTML = ''; container.innerHTML = '';
        
        sessionData.forEach((item, idx) => {
            // 如果不是恢复模式，则正常增加练习次数
            if (!isRestore) {
                history[item.title] = (history[item.title] || 0) + 1;
            }
            
            const btn = document.createElement('button');
            btn.className = `mini-btn ${idx === 0 ? 'active' : ''}`;
            btn.innerText = `P${idx + 1}`;
            btn.onclick = () => switchTab(idx);
            nav.appendChild(btn);

            const frame = document.createElement('iframe');
            frame.id = `frame-${idx}`;
            frame.src = item.html;

            frame.onload = function() {
                try {
                    const win = frame.contentWindow;
                    win.confirm = function() { return true; };
                    win.alert = function() { return true; };
                } catch (e) { console.warn("跨域限制。"); }
            };

            if(idx === 0) frame.className = 'active';
            container.appendChild(frame);
        });

        localStorage.setItem('ielts_history_v2', JSON.stringify(history));
        document.getElementById('exam-overlay').style.display = 'flex';
        startTimer();
        loadAudio(0);
        updateLastSessionUI();
    }

    function loadAudio(idx) {
        const player = document.getElementById('global-player');
        if(!sessionData[idx]) return;
        currentPlayingIdx = idx;
        player.src = sessionData[idx].audio;
        document.getElementById('audio-label').innerText = `P${idx+1}`;
        player.play();

        const skipBtn = document.getElementById('skip-audio-btn');
        skipBtn.style.display = (currentPlayingIdx < sessionData.length - 1) ? 'inline-block' : 'none';

        player.onended = () => {
            if(currentPlayingIdx < sessionData.length - 1) {
                loadAudio(currentPlayingIdx + 1);
            } else {
                autoSubmitAll(); 
            }
        };
    }

    function skipToNextAudio() {
        if(currentPlayingIdx < sessionData.length - 1) loadAudio(currentPlayingIdx + 1);
    }

    function autoSubmitAll() {
        document.getElementById('audio-label').innerText = "Finish";
        sessionData.forEach((_, idx) => {
            const frame = document.getElementById(`frame-${idx}`);
            if (!frame) return;
            try {
                const win = frame.contentWindow;
                const doc = win.document;
                win.confirm = function() { return true; };
                const funcs = ['checkAnswers', 'finishTest', 'onFinish', 'submitExam'];
                funcs.forEach(f => { if(typeof win[f] === 'function') win[f](); });
                const selectors = ['#finish', '#submit', '.finish-button', '.submit-btn'];
                selectors.forEach(s => {
                    const el = doc.querySelector(s);
                    if(el) el.click();
                });
            } catch (e) {}
        });
        stopTimer();
        alert("听力模考结束！已自动收卷。");
    }

    function startTimer() {
        secondsElapsed = 0;
        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            secondsElapsed++;
            const m = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const s = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timer').innerText = `00:${m}:${s}`;
        }, 1000);
    }

    function stopTimer() { clearInterval(timerInterval); }

    function switchTab(idx) {
        document.querySelectorAll('.mini-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
        document.querySelectorAll('iframe').forEach((f, i) => f.classList.toggle('active', i === idx));
    }

    function exitExam() {
        if(confirm("确定要退出模考吗？(记录已保存在侧边栏)")) {
            stopTimer();
            document.getElementById('global-player').pause();
            document.getElementById('exam-overlay').style.display = 'none';
            render();
        }
    }

    function clearHistory() {
        if(confirm("确定清空记录吗？")) {
            history = {};
            lastSession = [];
            localStorage.removeItem('ielts_history_v2');
            localStorage.removeItem('ielts_listening_last_session');
            render();
        }
    }

    window.onload = render;
</script>
</body>
</html>
